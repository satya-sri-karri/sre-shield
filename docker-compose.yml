version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sre-shield-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=sqlite+aiosqlite:///./data/sre_shield.db
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - SIMULATION_MODE=true
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: sre-shield-frontend
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/sre_shield.db
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
